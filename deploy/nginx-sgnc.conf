# SGNC — configuração Nginx (HTTP).
# O bloco HTTPS (listen 443 ssl ...) é adicionado automaticamente pelo Certbot
# quando você rodar `sudo certbot --nginx`. Veja docs/DEPLOY.md.
#
# Instalação:
#   sudo cp deploy/nginx-sgnc.conf /etc/nginx/sites-available/sgnc
#   sudo ln -s /etc/nginx/sites-available/sgnc /etc/nginx/sites-enabled/sgnc
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # TROQUE pelos seus domínios:
    server_name seu-dominio.com.br www.seu-dominio.com.br;

    # Build do front (Vite). Ajuste se clonar em outro caminho.
    root /var/www/sgnc/dist;
    index index.html;

    # Permite o upload das fotos de RNC (o multipart passa pelo Nginx).
    client_max_body_size 25M;

    # API + health-check -> Node/Express em 127.0.0.1:3333
    location /api/ {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3333/health;
        proxy_set_header Host $host;
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router/cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
